<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>排班表</title>
<style>
html{-webkit-text-size-adjust:100%}
body{font-family:Arial;margin:0;background:#fce4ec;color:#4a2c3a;padding:10px 8px}
.month-card{background:#fff;border:1px solid #f8bbd0;border-radius:10px;padding:10px;margin-bottom:16px;box-shadow:0 1px 3px rgba(194,24,91,0.08)}
.month-title{font-size:1.8em;font-weight:bold;color:#ad1457;margin:6px 0 12px 0;text-align:center}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.weekdays div{text-align:center;font-size:1.25em;color:#880e4f;padding:3px 0;font-weight:bold}
.weekdays div.wk{color:#e91e63}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day-cell{display:flex;flex-direction:column;border-radius:5px;overflow:hidden;background:#fdf5f7;min-height:98px;cursor:pointer;transition:box-shadow .15s}
.day-cell:not(.empty):hover{box-shadow:inset 0 0 0 1px #f8bbd0}
.day-cell.empty{background:transparent;min-height:98px;cursor:default}
.day-cell.past .day-num,.day-cell.past .shift-male,.day-cell.past .shift-female,.day-cell.past .lunar:not(.month){opacity:0.35}
.day-cell.past{background:#fcf5f8}
.day-cell.today{animation:todayPulse 1.8s ease-in-out infinite}
.day-num{text-align:center;font-size:1.35em;color:#4a2c3a;padding:3px 0;font-weight:bold;line-height:1.1}
.shift-male,.shift-female{height:18px;margin:2px 3px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:0.72em;font-weight:bold;line-height:1}
.shift-male.day,.shift-female.day{background:#fff;color:#4a2c3a;box-shadow:inset 0 0 0 1px #f8bbd0}
.shift-male.night,.shift-female.night{background:#1a237e;color:#fff}
.shift-male.rest,.shift-female.rest{background:#e8e8e8;color:#4a2c3a;box-shadow:inset 0 0 0 1px #ddd}
.wx-icon{font-size:1.5em;line-height:1;vertical-align:middle;margin-left:1px}
.lunar{text-align:center;font-size:1.2em;padding:2px 1px;color:#8d6e63;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.15}
.lunar.month{color:#ff0000;font-weight:bold}.lunar.fest{color:#d32f2f;font-weight:bold}.lunar.term{color:#2e7d32;font-weight:bold}
.toggleBtn{background:#ad1457;color:#fff;border:0;border-radius:20px;padding:8px 24px;font-size:1em;cursor:pointer;margin-bottom:16px}
@keyframes todayPulse{0%,100%{box-shadow:inset 0 0 0 2px #ad1457,0 0 3px rgba(173,20,87,0.3)}50%{box-shadow:inset 0 0 0 3px #ff4081,0 0 14px 3px rgba(255,64,129,0.55)}}
#weatherModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:100;justify-content:center;align-items:center;padding:20px}
.wm-box{background:#fff;border-radius:14px;padding:26px 22px 20px;max-width:380px;width:100%;position:relative;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.wm-close{position:absolute;top:6px;right:14px;font-size:1.8em;color:#999;cursor:pointer;line-height:1}
.wd-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f0f0f0;font-size:1.15em;color:#4a2c3a}
.wd-row:last-child{border-bottom:0}
.wd-row b{color:#ad1457;font-size:1.05em}
.wd-title{text-align:center;font-size:1.35em;font-weight:bold;color:#ad1457;margin-bottom:16px}
.wd-title-sub{font-size:0.72em;color:#8d6e63;font-weight:normal}
.wd-big-icon{text-align:center;font-size:2.6em;line-height:1;margin-bottom:12px}
</style>
</head>
<body>
<div id="historyContainer"></div>
<div id="topBtnArea"></div>
<div id="calContainer"></div>

<div id="weatherModal" onclick="if(event.target===this)closeWeatherModal()">
  <div class="wm-box">
    <div class="wm-close" onclick="closeWeatherModal()">×</div>
    <div id="weatherModalBody"></div>
  </div>
</div>

<script>
var lunarInfo=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,0x0d520];
var lunarMonths=['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var lunarDays=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
var lunarFestivals={'1-1':'春节','1-15':'元宵','2-2':'龙抬','5-5':'端午','7-7':'七夕','7-15':'中元','8-15':'中秋','9-9':'重阳','12-8':'腊八','12-23':'小年'};
var solarFestivals={'1-1':'元旦','3-8':'妇女','5-1':'劳动','6-1':'儿童','9-10':'教师','10-1':'国庆','12-25':'圣诞'};
var sTermInfo=[0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
var sTermNames=['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
function leapMonth(y){return lunarInfo[y-1900]&0xf;} function leapDays(y){if(leapMonth(y))return (lunarInfo[y-1900]&0x10000)?30:29;return 0;} function monthDays(y,m){return (lunarInfo[y-1900]&(0x10000>>m))?30:29;} function lYearDays(y){var i,sum=348;for(i=0x8000;i>0x8;i>>=1)sum+=(lunarInfo[y-1900]&i)?1:0;return sum+leapDays(y);}
function solar2lunar(y,m,d){var baseDate=new Date(1900,0,31);var objDate=new Date(y,m-1,d);var offset=Math.floor((objDate-baseDate)/86400000);var temp=0,i;for(i=1900;i<2101&&offset>0;i++){temp=lYearDays(i);offset-=temp;}if(offset<0){offset+=temp;i--;}var yearC=i;var leap=leapMonth(i);var isLeap=false;for(i=1;i<13&&offset>0;i++){if(leap>0&&i==(leap+1)&&!isLeap){--i;isLeap=true;temp=leapDays(yearC);}else{temp=monthDays(yearC,i);}if(isLeap&&i==(leap+1))isLeap=false;offset-=temp;}if(offset==0&&leap>0&&i==leap+1){if(isLeap){isLeap=false;}else{isLeap=true;--i;}}if(offset<0){offset+=temp;--i;}return{year:yearC,month:i,day:offset+1,isLeap:isLeap};}
function getTerm(y,n){var offDate=new Date((31556925974.7*(y-1900)+sTermInfo[n]*60000)+Date.UTC(1900,0,6,2,5));return offDate.getUTCDate();}
function getTermName(y,m,d){var n1=(m-1)*2,n2=n1+1;if(getTerm(y,n1)===d)return sTermNames[n1];if(getTerm(y,n2)===d)return sTermNames[n2];return null;}
function getLunarLabel(y,m,d){var sFest=solarFestivals[m+'-'+d];if(sFest)return{text:sFest,cls:'fest'};var lunar=solar2lunar(y,m,d);var lFest=lunarFestivals[lunar.month+'-'+lunar.day];if(lFest&&!lunar.isLeap)return{text:lFest,cls:'fest'};var nd=new Date(y,m-1,d+1);var nl=solar2lunar(nd.getFullYear(),nd.getMonth()+1,nd.getDate());if(nl.month===1&&nl.day===1&&!nl.isLeap)return{text:'除夕',cls:'fest'};var term=getTermName(y,m,d);if(term)return{text:term,cls:'term'};if(lunar.day===1)return{text:lunarMonths[lunar.month-1]+'月',cls:'month'};return{text:lunarDays[lunar.day-1],cls:''};}

var BASE_DATE=new Date(2026,9,9);var MALE_CYCLE=3;var FEMALE_CYCLE=8;var MONTHS_AFTER=12;var EXPANDED=false;
var dayDiff=function(d){return Math.round((d-BASE_DATE)/86400000);};
var getMaleShift=function(d){var off=((dayDiff(d)%MALE_CYCLE)+MALE_CYCLE)%MALE_CYCLE;return off===0?'day':off===1?'night':'rest';};
var getFemaleShift=function(d){var off=((dayDiff(d)%FEMALE_CYCLE)+FEMALE_CYCLE)%FEMALE_CYCLE;if(off===0)return'day';if(off===1)return'night';if(off===3)return'day';if(off===4)return'night';return'rest';};
var shiftLabel=function(s){return s==='day'?'白':(s==='night'?'夜':'');};

var weatherMap = {};
function beaufortLevel(kmh){ if(kmh < 2) return 0; if(kmh < 7) return 1; if(kmh < 13) return 2; if(kmh < 20) return 3; if(kmh < 31) return 4; if(kmh < 41) return 5; if(kmh < 52) return 6; if(kmh < 63) return 7; if(kmh < 76) return 8; if(kmh < 88) return 9; if(kmh < 104) return 10; if(kmh < 118) return 11; return 12; }
function windDirName(deg){ if(deg == null) return '--'; var dirs = ['北','东北','东','东南','南','西南','西','西北']; return dirs[Math.round(deg / 45) % 8]; }
function wmoDesc(c){ if (c === 0) return '晴'; if (c === 1) return '晴间多云'; if (c === 2) return '多云'; if (c === 3) return '阴'; if (c === 45 || c === 48) return '雾'; if (c >= 51 && c <= 55) return '毛毛雨'; if (c === 56 || c === 57) return '冻毛毛雨'; if (c >= 61 && c <= 65) return '雨'; if (c === 66 || c === 67) return '冻雨'; if (c >= 71 && c <= 75) return '雪'; if (c === 77) return '雪粒'; if (c >= 80 && c <= 82) return '阵雨'; if (c >= 85 && c <= 86) return '阵雪'; if (c === 95) return '雷阵雨'; if (c === 96 || c === 99) return '雷阵雨伴冰雹'; return '未知'; }
function isRainCode(c){ return (c >= 61 && c <= 67) || (c >= 80 && c <= 82); }
function isSnowCode(c){ return (c >= 71 && c <= 77) || (c >= 85 && c <= 86); }

// 这里改为请求 Netlify 自己的后台，毫秒级响应（因为有 CDN 缓存）
function loadWeather(){
  fetch('/.netlify/functions/weather')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data || !data.days) return;
      for (var i = 0; i < data.days.length; i++) {
        var d = data.days[i];
        weatherMap[d.date] = {
          dayCode: d.dayCode, nightCode: d.nightCode,
          tmax: d.tmax, tmin: d.tmin, precip: d.precip,
          windSpeed: d.windSpeed, windDir: d.windDir
        };
      }
      renderCalendar();
    }).catch(function(){});
}

function showWeatherDetail(dateKey){
  var w = weatherMap[dateKey];
  if (!w) return;
  var body = document.getElementById('weatherModalBody');
  var parts = dateKey.split('-');
  var y = +parts[0], m = +parts[1], d = +parts[2];
  var lun = getLunarLabel(y, m, d);
  var title = '<div class="wd-title">' + y + '年' + m + '月' + d + '日 <span class="wd-title-sub">' + lun.text + '</span></div>';
  var bf = w.windSpeed != null ? beaufortLevel(w.windSpeed) : null;
  var wd = windDirName(w.windDir);
  var windStr = '--';
  if (w.windDir != null && bf != null) windStr = wd + '风 ' + bf + '级';
  else if (w.windDir != null) windStr = wd + '风 ';
  else if (bf != null) windStr = bf + '级';
  var dayDesc = w.dayCode != null ? wmoDesc(w.dayCode) : '--';
  var nightDesc = w.nightCode != null ? wmoDesc(w.nightCode) : '--';
  var dayNightStr = (w.dayCode === w.nightCode) ? dayDesc : ('白天 ' + dayDesc + ' / 夜间 ' + nightDesc);
  var bigIcon = '☀';
  if (isRainCode(w.dayCode) || isRainCode(w.nightCode)) bigIcon = '🌧';
  else if (isSnowCode(w.dayCode) || isSnowCode(w.nightCode)) bigIcon = '❄';
  else if (w.dayCode != null && w.dayCode >= 1 && w.dayCode <= 3) bigIcon = '⛅';

  body.innerHTML = title
    + '<div class="wd-big-icon">' + bigIcon + '</div>'
    + '<div class="wd-row"><span>天气（昼夜）</span><b>' + dayNightStr + '</b></div>'
    + '<div class="wd-row"><span>最高温</span><b>' + (w.tmax != null ? Number(w.tmax).toFixed(1) + ' °C' : '--') + '</b></div>'
    + '<div class="wd-row"><span>最低温</span><b>' + (w.tmin != null ? Number(w.tmin).toFixed(1) + ' °C' : '--') + '</b></div>'
    + '<div class="wd-row"><span>降水概率</span><b>' + (w.precip != null ? w.precip + ' %' : '--') + '</b></div>'
    + '<div class="wd-row"><span>风向风力</span><b>' + windStr + '</b></div>';
  document.getElementById('weatherModal').style.display = 'flex';
}
function closeWeatherModal(){ document.getElementById('weatherModal').style.display = 'none'; }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeWeatherModal(); });

var renderMonth=function(date,today){
  var year=date.getFullYear();var month=date.getMonth();
  var firstDay=new Date(year,month,1);var daysInMonth=new Date(year,month+1,0).getDate();
  var startWeekday=(firstDay.getDay()+6)%7;var key=year*12+month;
  var html='<div class="month-card" id="month-'+key+'"><div class="month-title">'+year+'年'+(month+1)+'月</div><div class="weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="wk">六</div><div class="wk">日</div></div><div class="days-grid">';
  for(var i=0;i<startWeekday;i++)html+='<div class="day-cell empty"></div>';
  for(var d=1;d<=daysInMonth;d++){
    var cur=new Date(year,month,d);cur.setHours(0,0,0,0);
    var isPast=cur<today;
    var isToday=cur.getTime()===today.getTime();
    var ms=getMaleShift(cur); var fs=getFemaleShift(cur);
    var cls='day-cell';
    if(isPast)cls+=' past';
    var __nowH = new Date().getHours();
    var __prevDay = (__nowH >= 0 && __nowH < 3) && (Math.round((today.getTime() - cur.getTime()) / 86400000) === 1);
    if(isToday || __prevDay)cls+=' today';
    var lun=getLunarLabel(year,month+1,d);
    var dateKey=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var w=weatherMap[dateKey]; var wIcon='';
    if(w){
      if (isRainCode(w.dayCode) || isRainCode(w.nightCode)) wIcon='<span class="wx-icon">🌧</span>';
      else if (isSnowCode(w.dayCode) || isSnowCode(w.nightCode)) wIcon='<span class="wx-icon">❄</span>';
    }
    html+='<div class="'+cls+'" onclick="showWeatherDetail(\''+dateKey+'\')">'
      +'<div class="day-num">'+d+'</div>'
      +'<div class="shift-male '+ms+'">'+shiftLabel(ms)+wIcon+'</div>'
      +'<div class="shift-female '+fs+'">'+shiftLabel(fs)+'</div>'
      +'<div class="lunar '+lun.cls+'">'+lun.text+'</div>'
      +'</div>';
  }
  html+='</div></div>';return html;
};

var renderCalendar=function(){
  var container=document.getElementById('calContainer');
  var historyContainer=document.getElementById('historyContainer');
  var topBtn=document.getElementById('topBtnArea');
  var today=new Date();today.setHours(0,0,0,0);
  var baseYear=today.getFullYear();var baseMonth=today.getMonth();
  var html='';
  for(var m=0;m<=MONTHS_AFTER;m++){var d=new Date(baseYear,baseMonth+m,1);html+=renderMonth(d,today);}
  container.innerHTML=html;
  var histHtml='';
  if(EXPANDED){ for(var m=-12;m<=-1;m++){var d=new Date(baseYear,baseMonth+m,1);histHtml+=renderMonth(d,today);} }
  historyContainer.innerHTML=histHtml;
  if(EXPANDED)topBtn.innerHTML='<button class="toggleBtn" onclick="toggleExpand()">收起历史数据</button>';
  else topBtn.innerHTML='<button class="toggleBtn" onclick="toggleExpand()">显示历史数据（过去 12 个月）</button>';
  if(!window.__scheduleScrolled){
    window.__scheduleScrolled=true;
    var curKey=baseYear*12+baseMonth;
    setTimeout(function(){ var curEl=document.getElementById('month-'+curKey); if(curEl)curEl.scrollIntoView({block:'start'}); },150);
  }
};

window.toggleExpand=function(){
  if(!EXPANDED){
    EXPANDED=true; renderCalendar();
    var hc=document.getElementById('historyContainer'); var added = hc ? hc.offsetHeight : 0;
    window.scrollTo(0, window.pageYOffset + added);
  } else {
    var hc=document.getElementById('historyContainer'); var removed = hc ? hc.offsetHeight : 0;
    EXPANDED=false; renderCalendar();
    window.scrollTo(0, Math.max(0, window.pageYOffset - removed));
  }
};

renderCalendar();
loadWeather();
</script>
</body>
</html>
